{% extends "auth/_acceso.html" %}
{% block titulo %}Iniciar sesión · {{ empresa.nombre }}{% endblock %}
{% block contenido %}
{% if empresa.logo %}<img src="{{ url_for('configuracion.logo') }}" alt="{{ empresa.nombre }}" style="height:64px;margin-bottom:18px">{% endif %}
<h1>{{ empresa.nombre }}</h1>
<p class="muted" style="margin:0 0 22px">Ingresa a tu gestor comercial.</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div><label for="email">Correo</label><input type="email" id="email" name="email" required autofocus></div>
  <div><label for="clave">Contraseña</label><input type="password" id="clave" name="clave" required></div>
  <button class="btn btn-primario" type="submit">Ingresar</button>
</form>
{% endblock %}
