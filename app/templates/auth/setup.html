{% extends "auth/_acceso.html" %}
{% block titulo %}Configuración inicial{% endblock %}
{% block contenido %}
<h1>Bienvenido</h1>
<p class="muted" style="margin:0 0 22px">Crea tu cuenta de administrador para empezar.</p>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div><label for="empresa">Nombre de la empresa</label><input type="text" id="empresa" name="empresa" required></div>
  <div><label for="nombre">Tu nombre</label><input type="text" id="nombre" name="nombre" required></div>
  <div><label for="email">Correo de acceso</label><input type="email" id="email" name="email" required></div>
  <div><label for="clave">Contraseña</label><input type="password" id="clave" name="clave" minlength="8" required>
    <div class="ayuda">Mínimo 8 caracteres.</div></div>
  <button class="btn btn-primario" type="submit">Crear cuenta</button>
</form>
{% endblock %}
