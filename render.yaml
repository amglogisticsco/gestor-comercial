services:
  - type: web
    name: gestor-comercial
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /login
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: ZONA_HORARIA
        value: America/Bogota
      - key: CUMPLE_HORA
        value: "8"
